<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gig board — TalentX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/gigs.css">
</head>
<body>
  <header class="navbar"></header>

  <main class="container page">
    <div class="page-head">
      <div>
        <h1>Gig board</h1>
        <p class="muted">Shoots and casting calls across the industry.</p>
      </div>
      <a class="btn" href="/pages/create-gig.html">+ Post a gig</a>
    </div>

    <form id="filters" class="filters reveal">
      <div class="field"><label for="f-discipline">Discipline</label><input id="f-discipline" placeholder="photographer…"></div>
      <div class="field"><label for="f-city">City</label><input id="f-city" placeholder="Mumbai…"></div>
      <div class="field"><label for="f-min">Min budget</label><input id="f-min" type="number" min="0" placeholder="0"></div>
      <div class="field"><label for="f-max">Max budget</label><input id="f-max" type="number" min="0" placeholder="50000"></div>
      <div class="field"><label for="f-rating">Min giver rating</label>
        <select id="f-rating">
          <option value="">Any</option>
          <option value="3">3.0+</option>
          <option value="4">4.0+</option>
          <option value="4.5">4.5+</option>
        </select>
      </div>
      <div class="field"><label for="f-status">Status</label>
        <select id="f-status">
          <option value="OPEN">Open</option>
          <option value="">All</option>
          <option>HIRED</option>
          <option>IN_PROGRESS</option>
          <option>DELIVERED</option>
          <option>COMPLETED</option>
          <option>DISPUTED</option>
          <option>CANCELLED</option>
        </select>
      </div>
      <button class="btn" type="submit">Filter</button>
    </form>

    <div id="gig-grid" class="card-grid"></div>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/gigs.js"></script>
</body>
</html>
